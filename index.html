<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業繳交登記系統</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <!-- SheetJS 用於讀取 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: #1e293b; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 卡片通用樣式 */
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #f1f5f9; }
        
        /* 登入畫面樣式 */
        .login-title { text-align: center; color: #2563eb; font-size: 22px; font-weight: bold; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; font-size: 15px; }
        .form-group select, .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; transition: 0.2s; background: white; }
        .form-group select:focus, .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }

        /* 頂部使用者資訊欄 */
        .user-header { display: flex; justify-content: space-between; align-items: center; }
        .user-info { font-size: 16px; font-weight: bold; }
        .user-role { color: #2563eb; }
        .btn-logout { padding: 8px 16px; background: #e2e8f0; color: #475569; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* 導師專用黃色區塊 */
        .mentor-card { background: #fffde7; border: 1px solid #fff59d; }
        .mentor-title { font-weight: bold; color: #854d0e; margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; gap: 6px; }
        .btn-upload { background: #d97706; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-upload:hover { background: #b45309; }

        /* 分頁切換列 */
        .tab-bar { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-weight: bold; color: #64748b; cursor: pointer; font-size: 16px; position: relative; }
        .tab-item.active { color: #2563eb; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background: #2563eb; border-radius: 3px 3px 0 0; }

        /* 缺交作業總表卡片 */
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .student-item-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .student-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 18px; font-weight: bold; }
        .seat-badge { width: 28px; height: 28px; background: #dbeafe; color: #1e40af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        
        .missing-list { list-style: none; padding: 0; margin: 0; }
        .missing-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid #f1f5f9; font-size: 15px; }
        .missing-info { display: flex; align-items: center; gap: 6px; color: #b91c1c; font-weight: 500; }
        .registrar-tag { font-size: 12px; color: #94a3b8; background: #f8fafc; padding: 3px 8px; border-radius: 4px; border: 1px solid #f1f5f9; }

        /* 作業登記模式 - 學生點擊網格 */
        .student-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .clickable-student { padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; text-align: center; cursor: pointer; user-select: none; }
        .status-not_submitted { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        .status-submitted { background: #f0fdf4; border-color: #22c55e; color: #166534; }
        .status-incomplete { background: #fffbeb; border-color: #f59e0b; color: #92400e; }

        /* 作業列 */
        .hw-bar-item { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #2563eb; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. 登入畫面 -->
    <div id="loginCard" class="card">
        <div class="login-title">作業繳交系統登入</div>
        
        <div class="form-group">
            <label>請選擇登入身份</label>
            <select id="userSelect">
                <option value="mentor">👑 導師</option>
                <!-- 動態讀取學生姓名下拉選單 -->
            </select>
        </div>
        
        <div class="form-group">
            <label id="pwdLabel">身分證末六碼 (密碼)</label>
            <input type="password" id="loginPasswordInput" placeholder="請輸入身分證末六碼">
        </div>
        
        <button class="btn-primary" id="loginBtn">登入系統</button>
    </div>

    <!-- 2. 主控制介面 -->
    <div id="mainDashboard" style="display: none;">
        
        <!-- 頂部使用者狀態區 -->
        <div class="card user-header">
            <div class="user-info">目前使用者：<span id="displayRoleText" class="user-role">導師</span></div>
            <button class="btn-logout" id="logoutBtn">登出</button>
        </div>

        <!-- 導師專用：匯入 Excel 區塊 -->
        <div id="mentorImportCard" class="card mentor-card" style="display: none;">
            <div class="mentor-title">📋 導師專用：匯入 Excel 學生名單</div>
            <p style="font-size:12px; color:#854d0e; margin:-5px 0 10px 0;">*請確保 Excel 欄位包含：<strong>座號</strong>、<strong>姓名</strong>、<strong>密碼</strong> (請填寫學生身分證末六碼)</p>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="width: 100%; font-size: 14px;">
            <button class="btn-upload" id="uploadExcelBtn">上傳名單至資料庫</button>
            <div id="importStatus" style="font-size: 13px; margin-top: 8px; font-weight: bold;"></div>
        </div>

        <!-- 功能頁籤區 -->
        <div class="tab-bar">
            <div class="tab-item" id="tabRegister">✏️ 作業登記模式</div>
            <div class="tab-item active" id="tabSummary">📚 缺交作業總表</div>
        </div>

        <!-- ================= 頁籤 1: 作業登記模式 ================= -->
        <div id="contentRegister" style="display: none;">
            <div class="card">
                <div class="section-title">📂 作業項目管理</div>
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="newHwInput" placeholder="例如: 數學 / 數習" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px;">
                    <button id="addHwBtn" style="padding:10px 15px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">＋ 新增</button>
                </div>

                <div id="hwBarsContainer"></div>
            </div>

            <div id="markingArea" class="card" style="display: none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <div style="font-weight:bold; font-size:16px;">✍️ 登記：<span id="currentHwTitle" style="color:#2563eb;"></span></div>
                    <button id="saveRecordsBtn" class="btn-primary" style="width:auto; padding:8px 16px;">💾 儲存變更</button>
                </div>
                <div style="font-size:12px; color:#64748b; margin-bottom:10px;">點擊切換：❌未交 ➔ ✅已交 ➔ ⚠️有缺漏</div>
                <div class="student-grid" id="studentGrid"></div>
            </div>
        </div>

        <!-- ================= 頁籤 2: 缺交作業總表 ================= -->
        <div id="contentSummary">
            <div class="section-title">📋 學生未完成清單</div>
            <div id="studentMissingContainer">
                <!-- 動態產生卡片 -->
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 請替換為您的 Firebase 設定 🔴
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDFzSAc08kJLlafPk-Ttb6zdlHvgMj05u8",
  authDomain: "chinese-class-12561.firebaseapp.com",
  projectId: "chinese-class-12561",
  storageBucket: "chinese-class-12561.firebasestorage.app",
  messagingSenderId: "767545693381",
  appId: "1:767545693381:web:4e4b0eed26e5fbda054cac",
  measurementId: "G-SRSMVT5SE0"
};

    const MENTOR_PIN = "8888"; // 導師預設密碼

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = ""; // 當前登入者名稱
    let isMentor = false;
    let currentHw = "";
    let currentStudents = [];
    let studentStates = {};

    // 頁面初次載入，先讀取學生清單填入下拉選單
    window.addEventListener('DOMContentLoaded', async () => {
        await fetchStudentsToDropdown();
    });

    // 動態變更登入提示文字
    document.getElementById('userSelect').addEventListener('change', (e) => {
        const pwdInput = document.getElementById('loginPasswordInput');
        if (e.target.value === "mentor") {
            pwdInput.placeholder = "請輸入導師密碼";
        } else {
            pwdInput.placeholder = "請輸入身分證末六碼";
        }
    });

    // 從 Firebase 載入學生名單至下拉選單
    async function fetchStudentsToDropdown() {
        const userSelect = document.getElementById('userSelect');
        userSelect.innerHTML = '<option value="mentor">👑 導師</option>';

        const snap = await getDocs(collection(db, "students"));
        currentStudents = [];
        snap.forEach(doc => currentStudents.push(doc.data()));
        currentStudents.sort((a, b) => a.seat - b.seat);

        currentStudents.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.seat;
            opt.innerText = `${s.seat}號 ${s.name}`;
            userSelect.appendChild(opt);
        });
    }

    // 防冒用登入驗證
    document.getElementById('loginBtn').addEventListener('click', () => {
        const selectedValue = document.getElementById('userSelect').value;
        const password = document.getElementById('loginPasswordInput').value.trim();

        if (selectedValue === "mentor") {
            if (password === MENTOR_PIN) {
                currentUser = "導師";
                isMentor = true;
                enterSystem();
            } else {
                alert("❌ 導師密碼錯誤！");
            }
        } else {
            // 搜尋該名學生的資料與身分證末六碼
            const student = currentStudents.find(s => String(s.seat) === String(selectedValue));
            if (student) {
                if (student.password && String(student.password) === password) {
                    currentUser = student.name;
                    isMentor = false;
                    enterSystem();
                } else {
                    alert(`❌ 密碼錯誤！請輸入 ${student.name} 的身分證末六碼。`);
                }
            }
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        document.getElementById('loginCard').style.display = 'block';
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('loginPasswordInput').value = '';
    });

    function enterSystem() {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        document.getElementById('displayRoleText').innerText = currentUser;

        document.getElementById('mentorImportCard').style.display = isMentor ? 'block' : 'none';

        loadSummaryList();
    }

    // Excel 匯入 (包含解析身分證末六碼密碼欄位)
    document.getElementById('uploadExcelBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('excelFileInput');
        const status = document.getElementById('importStatus');

        if (fileInput.files.length === 0) return alert("請先選擇 Excel 檔案！");

        const file = fileInput.files[0];
        const reader = new FileReader();
        status.style.color = "blue";
        status.innerText = "資料上傳中...";

        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                const batch = writeBatch(db);
                let count = 0;

                json.forEach(row => {
                    const seat = String(row["座號"] || "").trim();
                    const name = String(row["姓名"] || "").trim();
                    const pwd = String(row["密碼"] || "").trim();

                    if (seat && name && pwd) {
                        const docId = seat.padStart(2, '0');
                        batch.set(doc(db, "students", docId), { 
                            seat: Number(seat), 
                            name: name,
                            password: pwd 
                        });
                        count++;
                    }
                });

                await batch.commit();
                status.style.color = "green";
                status.innerText = `🎉 成功匯入 ${count} 筆學生與身分證末六碼資料！`;
                await fetchStudentsToDropdown();
            } catch (err) {
                status.style.color = "red";
                status.innerText = "❌ 匯入失敗，請確認欄位包含「座號」、「姓名」、「密碼」。";
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // 頁籤切換
    const tabRegister = document.getElementById('tabRegister');
    const tabSummary = document.getElementById('tabSummary');
    const contentRegister = document.getElementById('contentRegister');
    const contentSummary = document.getElementById('contentSummary');

    tabRegister.addEventListener('click', () => {
        tabRegister.className = "tab-item active";
        tabSummary.className = "tab-item";
        contentRegister.style.display = "block";
        contentSummary.style.display = "none";
        loadHomeworkBars();
    });

    tabSummary.addEventListener('click', () => {
        tabSummary.className = "tab-item active";
        tabRegister.className = "tab-item";
        contentSummary.style.display = "block";
        contentRegister.style.display = "none";
        loadSummaryList();
    });

    // 載入作業項目清單
    async function loadHomeworkBars() {
        const container = document.getElementById('hwBarsContainer');
        const snap = await getDocs(collection(db, "assignments"));
        container.innerHTML = '';

        if (snap.empty) {
            container.innerHTML = '<div style="color:#94a3b8; text-align:center;">尚無作業項目，請在上方新增！</div>';
            return;
        }

        snap.forEach(d => {
            const hwName = d.data().hwName;
            const item = document.createElement('div');
            item.className = 'hw-bar-item';
            item.innerHTML = `
                <div style="font-weight:bold;">📖 ${hwName}</div>
                <div>
                    <button style="padding:6px 12px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="window.selectHw('${hwName}')">登記</button>
                    ${isMentor ? `<button style="padding:6px 12px; background:#ef4444; color:white; border:none; border-radius:6px; cursor:pointer; margin-left:4px;" onclick="window.deleteHw('${hwName}')">刪除</button>` : ''}
                </div>
            `;
            container.appendChild(item);
        });
    }

    // 新增作業
    document.getElementById('addHwBtn').addEventListener('click', async () => {
        const hwName = document.getElementById('newHwInput').value.trim();
        if (!hwName) return alert("請輸入作業名稱！");

        await setDoc(doc(db, "assignments", hwName), { hwName: hwName, createdAt: new Date() });
        document.getElementById('newHwInput').value = '';
        loadHomeworkBars();
        window.selectHw(hwName);
    });

    window.deleteHw = async (hwName) => {
        if (!confirm(`確定要刪除「${hwName}」嗎？`)) return;
        await deleteDoc(doc(db, "assignments", hwName));
        loadHomeworkBars();
        document.getElementById('markingArea').style.display = 'none';
    };

    // 選擇作業進行登記
    window.selectHw = async (hwName) => {
        currentHw = hwName;
        document.getElementById('currentHwTitle').innerText = hwName;
        document.getElementById('markingArea').style.display = 'block';

        const snap = await getDocs(query(collection(db, "records"), where("hwName", "==", hwName)));
        studentStates = {};
        snap.forEach(d => studentStates[d.data().seat] = d.data().status);

        renderStudentGrid();
    };

    function renderStudentGrid() {
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';

        currentStudents.forEach(student => {
            const status = studentStates[student.seat] || 'not_submitted';
            const card = document.createElement('div');
            card.className = `clickable-student status-${status}`;

            let statusText = "❌ 未交";
            if (status === 'submitted') statusText = "✅ 已交";
            if (status === 'incomplete') statusText = "⚠️ 缺漏";

            card.innerHTML = `
                <div style="font-size:12px; opacity:0.8;">${student.seat} 號</div>
                <div style="font-weight:bold; font-size:16px; margin:4px 0;">${student.name}</div>
                <div style="font-size:12px; font-weight:bold;">${statusText}</div>
            `;

            card.onclick = () => {
                if (status === 'not_submitted') studentStates[student.seat] = 'submitted';
                else if (status === 'submitted') studentStates[student.seat] = 'incomplete';
                else studentStates[student.seat] = 'not_submitted';
                renderStudentGrid();
            };
            grid.appendChild(card);
        });
    }

    // 儲存變更
    document.getElementById('saveRecordsBtn').addEventListener('click', async () => {
        const batch = writeBatch(db);
        const todayStr = new Date().toISOString().split('T')[0];

        currentStudents.forEach(s => {
            const status = studentStates[s.seat] || 'not_submitted';
            const ref = doc(db, "records", `${s.seat}_${currentHw}`);
            batch.set(ref, {
                seat: s.seat,
                name: s.name,
                hwName: currentHw,
                status: status,
                dateStr: todayStr,
                registeredBy: currentUser
            });
        });

        await batch.commit();
        alert(`🎉 「${currentHw}」登記已儲存！`);
        document.getElementById('markingArea').style.display = 'none';
    });

    // 渲染缺交總表
    async function loadSummaryList() {
        const container = document.getElementById('studentMissingContainer');
        container.innerHTML = '<div style="color:#94a3b8; text-align:center;">資料載入中...</div>';

        const snap = await getDocs(collection(db, "records"));
        let map = {};

        currentStudents.forEach(s => map[s.seat] = { name: s.name, seat: s.seat, items: [] });

        snap.forEach(d => {
            const r = d.data();
            if (r.status !== 'submitted' && map[r.seat]) {
                map[r.seat].items.push(r);
            }
        });

        container.innerHTML = '';
        let hasMissing = false;

        Object.keys(map).sort((a,b) => Number(a)-Number(b)).forEach(seat => {
            const student = map[seat];
            if (student.items.length > 0) {
                hasMissing = true;

                const card = document.createElement('div');
                card.className = 'student-item-card';

                let itemsHtml = student.items.map(item => {
                    const icon = item.status === 'not_submitted' ? '❌' : '⚠️';
                    const statusLabel = item.status === 'not_submitted' ? '未交' : '有缺漏';
                    return `
                        <li class="missing-item">
                            <div class="missing-info">
                                <span>${icon}</span>
                                <span>[${item.dateStr || '2026-09-04'}] ${item.hwName} (${statusLabel})</span>
                            </div>
                            <span class="registrar-tag">登記人: ${item.registeredBy || '導師'}</span>
                        </li>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="student-header">
                        <div class="seat-badge">${student.seat}</div>
                        <div>${student.name}</div>
                    </div>
                    <ul class="missing-list">
                        ${itemsHtml}
                    </ul>
                `;
                container.appendChild(card);
            }
        });

        if (!hasMissing) {
            container.innerHTML = '<div style="text-align:center; color:#22c55e; font-weight:bold; padding:30px;">🎉 全班目前沒有任何欠繳作業！</div>';
        }
    }
</script>

</body>
</html>
