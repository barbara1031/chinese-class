<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業繳交登記系統</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <!-- SheetJS 用於讀取 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: #1e293b; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 卡片通用樣式 */
        .card { background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #f1f5f9; }
        .page-title { text-align: center; color: #2563eb; font-size: 20px; font-weight: bold; margin-bottom: 20px; }

        /* 步驟一：班級按鈕網格 */
        .class-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
        .class-btn { padding: 15px 28px; font-size: 18px; background: #eff6ff; color: #2563eb; border: 2px solid #2563eb; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .class-btn:hover { background: #2563eb; color: white; }

        /* 通用表單控制項 */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; font-size: 15px; }
        .form-group select, .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; background: white; }
        .form-group select:focus, .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { width: 100%; padding: 10px; background: #e2e8f0; color: #475569; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-upload { background: #d97706; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }

        /* 頂部導航資訊欄 */
        .user-header { display: flex; justify-content: space-between; align-items: center; }
        .user-info { font-size: 15px; font-weight: bold; }
        .btn-logout { padding: 6px 12px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* 1. 修改頁籤名稱 */
        .tab-bar { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-weight: bold; color: #64748b; cursor: pointer; font-size: 15px; position: relative; }
        .tab-item.active { color: #2563eb; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background: #2563eb; border-radius: 3px 3px 0 0; }

        /* 缺交作業總表卡片 */
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .student-item-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .student-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 18px; font-weight: bold; }
        .seat-badge { width: 28px; height: 28px; background: #dbeafe; color: #1e40af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .missing-list { list-style: none; padding: 0; margin: 0; }
        
        /* 2. 讓總覽項目的 hover 特效與點擊指標更明顯 */
        .missing-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-top: 1px solid #f1f5f9; font-size: 15px; cursor: pointer; border-radius: 6px; transition: background 0.15s; }
        .missing-item:hover { background: #f8fafc; }
        .missing-info { display: flex; align-items: center; gap: 6px; color: #b91c1c; font-weight: 500; }
        .registrar-tag { font-size: 12px; color: #94a3b8; background: #f8fafc; padding: 3px 8px; border-radius: 4px; border: 1px solid #f1f5f9; }

        /* 作業登記模式 - 學生點擊網格 */
        .student-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .clickable-student { padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; text-align: center; cursor: pointer; user-select: none; }
        .status-not_submitted { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        .status-submitted { background: #f0fdf4; border-color: #22c55e; color: #166534; }
        .status-incomplete { background: #fffbeb; border-color: #f59e0b; color: #92400e; }

        .hw-bar-item { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #2563eb; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        /* 彈出視窗 (Modal) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 450px; }
    </style>
</head>
<body>

<div class="container">

    <!-- 第一頁：選擇班級 + 匯入名單 -->
    <div id="page1" class="card">
        <div class="page-title">🏫 步驟 1：請選擇班級</div>
        
        <div id="classButtonsContainer" class="class-grid">
            <span style="color:#888;">正在載入班級資料...</span>
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 25px 0;">
        <button class="btn-upload" id="openImportModalBtn">📥 匯入新班級 Excel 學生名單</button>
    </div>

    <!-- 第二頁：登入姓名與密碼 -->
    <div id="page2" class="card" style="display: none;">
        <div class="page-title">🔐 步驟 2：使用者登入</div>
        
        <div style="text-align:center; font-weight:bold; margin-bottom:15px; color:#2563eb;">
            當前選擇班級：<span id="displaySelectedClass"></span>
        </div>

        <div class="form-group">
            <label>請選擇姓名 / 身份</label>
            <select id="userSelect">
                <!-- 動態注入該班級學生 -->
            </select>
        </div>
        
        <div class="form-group">
            <label id="pwdLabel">身分證末六碼 (密碼)</label>
            <input type="password" id="loginPasswordInput" placeholder="請輸入身分證末六碼">
        </div>
        
        <button class="btn-primary" id="loginBtn">登入系統 👉</button>
        <button class="btn-secondary" id="backToPage1Btn">↺ 重新選擇班級</button>
    </div>

    <!-- 儀表板：包含作業登記與缺交總表 -->
    <div id="dashboard" style="display: none;">
        
        <!-- 頂部資訊欄 -->
        <div class="card user-header">
            <div class="user-info">
                📍 <span id="headerClassText" style="color:#2563eb;"></span> | 
                使用者：<span id="headerUserText"></span>
            </div>
            <button class="btn-logout" id="logoutBtn">登出 / 切換</button>
        </div>

        <!-- 1. 更新頁籤名稱 -->
        <div class="tab-bar">
            <div class="tab-item" id="tab3Btn">✏️ 作業登記模式</div>
            <div class="tab-item active" id="tab4Btn">📚 缺交作業總表</div>
        </div>

        <!-- 作業登記模式 -->
        <div id="page3Content" style="display: none;">
            <div class="card">
                <div class="section-title">📂 作業項目管理</div>
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="newHwInput" placeholder="例如: 數學 / 數習" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px;">
                    <button id="addHwBtn" style="padding:10px 15px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">＋ 新增</button>
                </div>

                <div id="hwBarsContainer"></div>
            </div>

            <div id="markingArea" class="card" style="display: none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <div style="font-weight:bold; font-size:16px;">✍️ 登記：<span id="currentHwTitle" style="color:#2563eb;"></span></div>
                    <button id="saveRecordsBtn" class="btn-primary" style="width:auto; padding:8px 16px;">💾 儲存變更</button>
                </div>
                <div style="font-size:12px; color:#64748b; margin-bottom:10px;">點擊切換：❌未交 ➔ ✅已交 ➔ ⚠️有缺漏</div>
                <div class="student-grid" id="studentGrid"></div>
            </div>
        </div>

        <!-- 缺交作業總表 -->
        <div id="page4Content">
            <div class="section-title">📋 學生未完成清單</div>
            <div id="studentMissingContainer">
                <!-- 動態產生缺交卡片 -->
            </div>
        </div>

    </div>
</div>

<!-- Excel 匯入彈出視窗 (Modal) -->
<div class="modal-overlay" id="importModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#d97706;">📥 匯入 Excel 學生名單</h3>
        <p style="font-size:13px; color:#666; line-height:1.5;">
            請確保 Excel 第一列欄位名稱精準包含：<br>
            <strong>班級</strong>、<strong>座號</strong>、<strong>姓名</strong>、<strong>密碼</strong> (可填身分證末六碼)
        </p>
        
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="width:100%; margin:15px 0;">
        <div id="importStatusText" style="font-size:13px; margin-bottom:15px; font-weight:bold;"></div>

        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn-secondary" id="closeImportModalBtn" style="width:auto; margin:0;">取消</button>
            <button id="startImportBtn" class="btn-upload" style="width:auto;">開始匯入</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 請替換為您的 Firebase 設定 🔴
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDFzSAc08kJLlafPk-Ttb6zdlHvgMj05u8",
  authDomain: "chinese-class-12561.firebaseapp.com",
  projectId: "chinese-class-12561",
  storageBucket: "chinese-class-12561.firebasestorage.app",
  messagingSenderId: "767545693381",
  appId: "1:767545693381:web:4e4b0eed26e5fbda054cac",
  measurementId: "G-SRSMVT5SE0"
};

    const MENTOR_PIN = "8888"; // 導師預設密碼

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentClass = "";
    let currentUser = "";
    let isMentor = false;
    let currentHw = "";
    let currentStudents = [];
    let studentStates = {};

    // 格式化身分證末六碼或數字密碼的輔助函數
    function formatPassword(rawPwd) {
        if (!rawPwd) return "";
        let pwd = String(rawPwd).trim();
        if (pwd.endsWith('.0')) pwd = pwd.slice(0, -2); // 清除 Excel float .0
        if (/^\d+$/.test(pwd) && pwd.length < 6) {
            pwd = pwd.padStart(6, '0'); // 自動補齊開頭被刪掉的 0
        }
        return pwd;
    }

    // 初始化：載入班級按鈕
    window.addEventListener('DOMContentLoaded', async () => {
        await loadClassButtons();
    });

    async function loadClassButtons() {
        const container = document.getElementById('classButtonsContainer');
        const snap = await getDocs(collection(db, "students"));
        
        const classSet = new Set();
        snap.forEach(docSnap => {
            if (docSnap.data().class) classSet.add(docSnap.data().class);
        });

        const classes = Array.from(classSet).sort();
        container.innerHTML = '';

        if (classes.length === 0) {
            container.innerHTML = '<span style="color:#888;">尚未匯入班級，請點擊下方按鈕上傳名單。</span>';
            return;
        }

        classes.forEach(className => {
            const btn = document.createElement('button');
            btn.className = 'class-btn';
            btn.innerText = `${className} 班`;
            btn.onclick = () => selectClassAndGoToPage2(className);
            container.appendChild(btn);
        });
    }

    // Modal 控制
    const importModal = document.getElementById('importModal');
    document.getElementById('openImportModalBtn').onclick = () => importModal.style.display = 'flex';
    document.getElementById('closeImportModalBtn').onclick = () => importModal.style.display = 'none';

    // 執行 Excel 匯入 (自動修正前導 0 與小數點)
    document.getElementById('startImportBtn').onclick = async () => {
        const fileInput = document.getElementById('excelFileInput');
        const statusText = document.getElementById('importStatusText');

        if (fileInput.files.length === 0) return alert("請先選擇 Excel 檔案！");

        const file = fileInput.files[0];
        const reader = new FileReader();
        statusText.style.color = "blue";
        statusText.innerText = "資料讀取與寫入中...";

        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false });

                const batch = writeBatch(db);
                let count = 0;

                json.forEach(row => {
                    const className = String(row["班級"] || "").trim();
                    const seat = String(row["座號"] || "").trim();
                    const name = String(row["姓名"] || "").trim();
                    
                    // 支援「密碼」或「身分證末六碼」欄位標題
                    const rawPwd = row["密碼"] || row["身分證末六碼"] || row["身分證號碼"] || "";
                    const pwd = formatPassword(rawPwd);

                    if (className && seat && name && pwd) {
                        const docId = `${className}_${seat.padStart(2, '0')}`;
                        batch.set(doc(db, "students", docId), { 
                            class: className,
                            seat: Number(seat), 
                            name: name,
                            password: pwd 
                        });
                        count++;
                    }
                });

                await batch.commit();
                statusText.style.color = "green";
                statusText.innerText = `🎉 成功匯入 ${count} 筆學生名單與密碼！`;
                setTimeout(() => {
                    importModal.style.display = 'none';
                    loadClassButtons();
                }, 1200);

            } catch (err) {
                console.error(err);
                statusText.style.color = "red";
                statusText.innerText = "❌ 匯入失敗，請確認欄位格式！";
            }
        };
        reader.readAsArrayBuffer(file);
    };

    // 選擇班級後進入第二頁
    async function selectClassAndGoToPage2(className) {
        currentClass = className;
        document.getElementById('displaySelectedClass').innerText = `${currentClass} 班`;

        const userSelect = document.getElementById('userSelect');
        userSelect.innerHTML = '<option value="mentor">👑 導師</option>';

        const q = query(collection(db, "students"), where("class", "==", currentClass));
        const snap = await getDocs(q);
        currentStudents = [];
        snap.forEach(docSnap => currentStudents.push(docSnap.data()));
        currentStudents.sort((a, b) => a.seat - b.seat);

        currentStudents.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.seat;
            opt.innerText = `${s.seat}號 ${s.name}`;
            userSelect.appendChild(opt);
        });

        document.getElementById('page1').style.display = 'none';
        document.getElementById('page2').style.display = 'block';
    }

    document.getElementById('backToPage1Btn').onclick = () => {
        document.getElementById('page2').style.display = 'none';
        document.getElementById('page1').style.display = 'block';
        document.getElementById('loginPasswordInput').value = '';
    };

    // 登入驗證
    document.getElementById('loginBtn').onclick = () => {
        const selectedValue = document.getElementById('userSelect').value;
        const password = formatPassword(document.getElementById('loginPasswordInput').value);

        if (selectedValue === "mentor") {
            if (password === MENTOR_PIN) {
                currentUser = "導師";
                isMentor = true;
                enterDashboard();
            } else {
                alert("❌ 導師密碼錯誤！");
            }
        } else {
            const student = currentStudents.find(s => String(s.seat) === String(selectedValue));
            if (student) {
                const dbPwd = formatPassword(student.password);
                if (dbPwd && dbPwd === password) {
                    currentUser = student.name;
                    isMentor = false;
                    enterDashboard();
                } else {
                    alert(`❌ 密碼錯誤！請確認身分證末六碼（如開頭為0請包含0）。`);
                }
            }
        }
    };

    function enterDashboard() {
        document.getElementById('page2').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        document.getElementById('headerClassText').innerText = `${currentClass} 班`;
        document.getElementById('headerUserText').innerText = currentUser;

        switchToPage4();
    }

    document.getElementById('logoutBtn').onclick = () => {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('page1').style.display = 'block';
        document.getElementById('loginPasswordInput').value = '';
        loadClassButtons();
    };

    // 頁籤切換
    const tab3Btn = document.getElementById('tab3Btn');
    const tab4Btn = document.getElementById('tab4Btn');
    const page3Content = document.getElementById('page3Content');
    const page4Content = document.getElementById('page4Content');

    tab3Btn.onclick = switchToPage3;
    tab4Btn.onclick = switchToPage4;

    function switchToPage3() {
        tab3Btn.className = 'tab-item active';
        tab4Btn.className = 'tab-item';
        page3Content.style.display = 'block';
        page4Content.style.display = 'none';
        loadHomeworkBars();
    }

    function switchToPage4() {
        tab4Btn.className = 'tab-item active';
        tab3Btn.className = 'tab-item';
        page4Content.style.display = 'block';
        page3Content.style.display = 'none';
        loadSummaryList();
    }

    // 2. 點擊缺交項目直接跳轉編輯的全域函數
    window.jumpToEditHw = (hwName) => {
        switchToPage3();
        window.selectHw(hwName);
    };

    // 作業登記
    async function loadHomeworkBars() {
        const container = document.getElementById('hwBarsContainer');
        const q = query(collection(db, "assignments"), where("class", "==", currentClass));
        const snap = await getDocs(q);
        container.innerHTML = '';

        if (snap.empty) {
            container.innerHTML = '<div style="color:#94a3b8; text-align:center;">尚無作業項目，請在上方新增！</div>';
            return;
        }

        snap.forEach(d => {
            const hwName = d.data().hwName;
            const item = document.createElement('div');
            item.className = 'hw-bar-item';
            item.innerHTML = `
                <div style="font-weight:bold;">📖 ${hwName}</div>
                <div>
                    <button style="padding:6px 12px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="window.selectHw('${hwName}')">登記</button>
                    ${isMentor ? `<button style="padding:6px 12px; background:#ef4444; color:white; border:none; border-radius:6px; cursor:pointer; margin-left:4px;" onclick="window.deleteHw('${hwName}')">刪除</button>` : ''}
                </div>
            `;
            container.appendChild(item);
        });
    }

    document.getElementById('addHwBtn').onclick = async () => {
        const hwName = document.getElementById('newHwInput').value.trim();
        if (!hwName) return alert("請輸入作業名稱！");

        await setDoc(doc(db, "assignments", `${currentClass}_${hwName}`), { 
            class: currentClass, 
            hwName: hwName, 
            createdAt: new Date() 
        });
        document.getElementById('newHwInput').value = '';
        loadHomeworkBars();
        window.selectHw(hwName);
    };

    window.deleteHw = async (hwName) => {
        if (!confirm(`確定要刪除「${hwName}」這條作業嗎？`)) return;
        await deleteDoc(doc(db, "assignments", `${currentClass}_${hwName}`));
        loadHomeworkBars();
        document.getElementById('markingArea').style.display = 'none';
    };

    window.selectHw = async (hwName) => {
        currentHw = hwName;
        document.getElementById('currentHwTitle').innerText = hwName;
        document.getElementById('markingArea').style.display = 'block';

        const q = query(collection(db, "records"), where("class", "==", currentClass), where("hwName", "==", hwName));
        const snap = await getDocs(q);
        studentStates = {};
        snap.forEach(d => studentStates[d.data().seat] = d.data().status);

        renderStudentGrid();
    };

    function renderStudentGrid() {
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';

        currentStudents.forEach(student => {
            const status = studentStates[student.seat] || 'not_submitted';
            const card = document.createElement('div');
            card.className = `clickable-student status-${status}`;

            let statusText = "❌ 未交";
            if (status === 'submitted') statusText = "✅ 已交";
            if (status === 'incomplete') statusText = "⚠️ 缺漏";

            card.innerHTML = `
                <div style="font-size:12px; opacity:0.8;">${student.seat} 號</div>
                <div style="font-weight:bold; font-size:16px; margin:4px 0;">${student.name}</div>
                <div style="font-size:12px; font-weight:bold;">${statusText}</div>
            `;

            card.onclick = () => {
                if (status === 'not_submitted') studentStates[student.seat] = 'submitted';
                else if (status === 'submitted') studentStates[student.seat] = 'incomplete';
                else studentStates[student.seat] = 'not_submitted';
                renderStudentGrid();
            };
            grid.appendChild(card);
        });
    }

    document.getElementById('saveRecordsBtn').onclick = async () => {
        const batch = writeBatch(db);
        const todayStr = new Date().toISOString().split('T')[0];

        currentStudents.forEach(s => {
            const status = studentStates[s.seat] || 'not_submitted';
            const ref = doc(db, "records", `${currentClass}_${s.seat}_${currentHw}`);
            batch.set(ref, {
                class: currentClass,
                seat: s.seat,
                name: s.name,
                hwName: currentHw,
                status: status,
                dateStr: todayStr,
                registeredBy: currentUser
            });
        });

        await batch.commit();
        alert(`🎉 「${currentHw}」登記已儲存！`);
        document.getElementById('markingArea').style.display = 'none';
    };

    // 2. 缺交總表渲染：讓條目可點擊跳轉
    async function loadSummaryList() {
        const container = document.getElementById('studentMissingContainer');
        container.innerHTML = '<div style="color:#94a3b8; text-align:center;">資料載入中...</div>';

        const q = query(collection(db, "records"), where("class", "==", currentClass));
        const snap = await getDocs(q);

        let map = {};
        currentStudents.forEach(s => map[s.seat] = { name: s.name, seat: s.seat, items: [] });

        snap.forEach(d => {
            const r = d.data();
            if (r.status !== 'submitted' && map[r.seat]) {
                map[r.seat].items.push(r);
            }
        });

        container.innerHTML = '';
        let hasMissing = false;

        Object.keys(map).sort((a,b) => Number(a)-Number(b)).forEach(seat => {
            const student = map[seat];
            if (student.items.length > 0) {
                hasMissing = true;

                const card = document.createElement('div');
                card.className = 'student-item-card';

                let itemsHtml = student.items.map(item => {
                    const icon = item.status === 'not_submitted' ? '❌' : '⚠️';
                    const statusLabel = item.status === 'not_submitted' ? '未交' : '有缺漏';
                    return `
                        <li class="missing-item" onclick="window.jumpToEditHw('${item.hwName}')" title="點擊跳轉編輯此作業">
                            <div class="missing-info">
                                <span>${icon}</span>
                                <span>[${item.dateStr || '2026-09-04'}] <strong>${item.hwName}</strong> (${statusLabel}) ✏️</span>
                            </div>
                            <span class="registrar-tag">登記人: ${item.registeredBy || '導師'}</span>
                        </li>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="student-header">
                        <div class="seat-badge">${student.seat}</div>
                        <div>${student.name}</div>
                    </div>
                    <ul class="missing-list">
                        ${itemsHtml}
                    </ul>
                `;
                container.appendChild(card);
            }
        });

        if (!hasMissing) {
            container.innerHTML = '<div style="text-align:center; color:#22c55e; font-weight:bold; padding:30px;">🎉 本班目前沒有任何欠繳作業！</div>';
        }
    }
</script>
